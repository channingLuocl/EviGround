[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seeground-local"
version = "0.1.0"
description = "Predicted-category 3D visual grounding with the frozen Qwen r18 pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy", "Pillow", "plyfile", "requests", "jsonschema>=4.18,<5",
  "json-repair", "python-dotenv", "spacy==3.8.16",
]

[project.scripts]
seeground = "seeground.cli.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seeground = ["_module_layout.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
